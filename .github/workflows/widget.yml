name: Publish widget

# Publishes the embeddable calendar widget and its data to GitHub Pages:
#   https://dawitzelleke.github.io/ethiopian-calendar/
# It reruns on the 1st of every month, so the data always covers the current
# Ethiopian year and the next two, and the calendar never goes out of date.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate calendar data and feed
        run: dotnet run --project EthiopianCalendar.Export --configuration Release -- site https://ethiopian-calendar.onrender.com parishes

      - name: Add the widget
        run: cp widget/* site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
