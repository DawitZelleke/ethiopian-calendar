# Render Blueprint: deploys the Dockerfile as one free web service.
# Render passes the port in $PORT, which the Dockerfile's start command reads.
services:
  - type: web
    name: ethiopian-calendar
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SiteUrl
        value: https://13thmonth.ca
      # Add CanonicalHost = 13thmonth.ca in the Render dashboard once the domain is verified,
      # to redirect thirteenthmonth.ca, www. and onrender.com visitors to 13thmonth.ca.
